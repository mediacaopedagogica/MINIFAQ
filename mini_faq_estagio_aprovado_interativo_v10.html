<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini FAQ — Trilha Formativa de Preparação para o Estágio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#24172e;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
.viewport{width:100vw;height:100svh;display:grid;place-items:center;padding:6px}
.scene{position:relative;width:min(calc(100vw - 12px),calc((100svh - 12px)*1.77683316));aspect-ratio:1672/941;overflow:hidden;border-radius:18px;background:#eee;box-shadow:0 20px 65px #0006}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}

/* Only the physical objects are clickable. The baked callouts are visual guidance only. */
.hit{position:absolute;z-index:8;border:0;padding:0;margin:0;background:transparent;cursor:pointer;outline:none}
.h1{left:1.2%;top:52.8%;width:23.5%;height:28.8%;clip-path:polygon(4% 8%,89% 0,100% 89%,13% 100%,0 86%)}
.h2{left:23.3%;top:47.8%;width:24.8%;height:30.2%;clip-path:polygon(4% 5%,94% 0,100% 89%,7% 100%,0 91%)}
.h3{left:45.7%;top:52.0%;width:22.4%;height:26.2%;clip-path:polygon(5% 2%,96% 7%,100% 92%,4% 100%,0 10%)}
.h4{left:65.0%;top:26.1%;width:27.4%;height:36.9%;clip-path:polygon(5% 0,95% 5%,100% 93%,5% 100%,0 10%)}
.h5{left:87.0%;top:58.4%;width:9.1%;height:24.0%;clip-path:polygon(25% 0,86% 7%,100% 91%,9% 100%,0 15%)}

/* Live session progress */
.progress{position:absolute;z-index:20;left:2.1%;bottom:2.4%;display:flex;align-items:center;gap:.55em;padding:.58em .95em;border:1.5px solid rgba(255,255,255,.94);border-radius:999px;background:linear-gradient(100deg,rgba(69,31,126,.95),rgba(91,45,143,.92));color:white;box-shadow:0 .45em 1.25em rgba(42,20,65,.38);font-weight:900;font-size:clamp(8px,.88vw,14px);backdrop-filter:blur(8px)}
.dots{display:flex;gap:.34em} .dot{width:1.05em;height:1.05em;border:.14em solid white;border-radius:50%;background:transparent;transition:.22s}
.dot.on{background:#ff69b3;box-shadow:0 0 .65em #ff85c4}
.star{color:#ffd33f}

/* FAQ card */
.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(34,20,48,.28);backdrop-filter:blur(3px)} .overlay.open{display:grid}
.card{position:relative;width:min(650px,93vw);max-height:82svh;overflow:auto;padding:22px;background:rgba(255,252,255,.985);border:2px solid #fff;border-radius:26px;box-shadow:0 28px 80px #2d173e70;animation:pop .24s ease}
.close{position:absolute;right:13px;top:12px;width:42px;height:42px;border:0;border-radius:50%;background:#f344a4;color:#fff;font-size:28px;cursor:pointer}
.head{display:flex;align-items:center;gap:15px;padding-right:47px} .ico{width:60px;height:60px;flex:none;border-radius:50%;display:grid;place-items:center;background:#efd8ff;font-size:31px}
h2{margin:0;color:#401793;font-size:clamp(18px,2vw,25px);line-height:1.18}
.answer{margin-top:15px;padding:16px 18px;border-radius:17px;background:#f6effa;color:#33235b;font-size:clamp(15px,1.45vw,18px);line-height:1.5}
.answer ul{margin:.45em 0 0;padding-left:1.3em} .page{margin-top:12px;text-align:center;color:#59407b;font-weight:900}
.done{position:fixed;z-index:70;left:50%;top:5%;transform:translate(-50%,-18px);opacity:0;pointer-events:none;padding:13px 22px;border-radius:999px;background:#fff;color:#4a2393;font-weight:900;box-shadow:0 10px 30px #351e4855;transition:.3s} .done.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

@media(max-width:680px){
 .viewport{padding:0}
 .scene{width:min(100vw,calc(100svh*1.77683316));max-width:100vw;border-radius:0}
 .progress{font-size:6.3px;left:1.4%;bottom:1.4%;padding:.48em .7em}
 .card{width:94vw;padding:18px} .ico{width:48px;height:48px;font-size:25px} h2{font-size:18px} .answer{font-size:15px}
}
</style>
</head>
